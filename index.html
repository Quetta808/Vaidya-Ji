<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AyurCare Store</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4fff4;
      color:#222;
    }

    /* Navbar */

    nav{
      background:#1f7a1f;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:white;
    }

    nav h1{
      font-size:30px;
    }

    nav ul{
      display:flex;
      list-style:none;
      gap:25px;
    }

    nav ul li{
      cursor:pointer;
      transition:0.3s;
    }

    nav ul li:hover{
      color:#d4ffd4;
    }

    /* Hero Section */

    .hero{
      text-align:center;
      padding:100px 20px;
      background:linear-gradient(to right,#dfffe0,#f4fff4);
    }

    .hero h2{
      font-size:55px;
      color:#1f7a1f;
      margin-bottom:20px;
    }

    .hero p{
      font-size:20px;
      color:#444;
      margin-bottom:30px;
    }

    .hero button{
      padding:15px 35px;
      background:#1f7a1f;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .hero button:hover{
      background:#145214;
    }

    /* Categories */

    .categories{
      padding:60px 20px;
      text-align:center;
    }

    .categories h3{
      font-size:40px;
      margin-bottom:40px;
      color:#1f7a1f;
    }

    .category-box{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h4{
      margin-top:15px;
      color:#1f7a1f;
    }

    /* Footer */

    footer{
      background:#1f7a1f;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:50px;
    }

    /* Mobile */

    @media(max-width:768px){

      nav{
        flex-direction:column;
        gap:15px;
      }

      .hero h2{
        font-size:38px;
      }

      nav ul{
        gap:15px;
      }

    }

  </style>

</head>

<body>

  <!-- Navbar -->

  <nav>

    <h1>AyurCare</h1>

    <ul>
      <li>Home</li>
      <li>Products</li>
      <li>About</li>
      <li>Contact</li>
    </ul>

  </nav>

  <!-- Hero Section -->

  <section class="hero">

    <h2>Natural Healing Starts Here</h2>

    <p>
      Ayurvedic & Homeopathic Medicines Delivered To Your Doorstep
    </p>

    <button>Shop Now</button>

  </section>

  <!-- Categories -->

  <section class="categories">

    <h3>Our Categories</h3>

    <div class="category-box">

      <div class="card">
        <h4>Ayurvedic Medicines</h4>
      </div>

      <div class="card">
        <h4>Homeopathic Medicines</h4>
      </div>
 </section>

  <!-- Footer -->

  <footer>

    <p>© 2026 AyurCare Store | All Rights Reserved</p>

  </footer>

</body>
</html>
