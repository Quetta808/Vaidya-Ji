<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAIDYA JI - Ayurvedic Store</title>
    <!-- Clean, modern styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Header / Navbar -->
    <header class="bg-emerald-700 text-white p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">VAIDYA JI</h1>
            <p class="text-sm italic">Pure Ayurvedic Solutions</p>
        </div>
    </header>

    <!-- Main Store Section -->
    <main class="max-w-4xl mx-auto p-6 mt-10">
        <h2 class="text-3xl font-bold text-center text-emerald-800 mb-8">Our Featured Products</h2>

        <!-- Product Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Product Item 1 -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100 flex flex-col justify-between">
                <div>
                    <div class="bg-emerald-100 h-40 w-full rounded-md mb-4 flex items-center justify-center text-emerald-700 font-bold">
                        [ Herbal Tonic Image ]
                    </div>
                    <h3 class="text-xl font-bold mb-2">Premium Ayurvedic Tonic</h3>
                    <p class="text-gray-600 text-sm mb-4">100% natural formula to boost daily energy, immunity, and overall vitality.</p>
                </div>
                <div>
                    <div class="text-2xl font-bold text-emerald-700 mb-4">₹499.00</div>
                    <!-- This button will link directly to payment later -->
                    <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded transition duration-200">
                        Buy Now
                    </button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
